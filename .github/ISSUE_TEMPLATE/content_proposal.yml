name: Đề xuất bài mới hoặc lộ trình mới
description: Thêm bài học, bài tập, hoặc cả một lộ trình
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: Đề xuất
      description: Lộ trình nào, chủ đề gì, dành cho ai.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Nguồn và tác giả
      description: Nội dung lấy từ nơi khác thì ghi nguồn, giấy phép, và đã xin phép tác giả chưa.
  - type: textarea
    id: done
    attributes:
      label: Hoàn thành khi
    validations:
      required: true
